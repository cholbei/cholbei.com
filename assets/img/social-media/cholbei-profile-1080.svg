<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080" role="img" aria-labelledby="title desc">
  <title id="title">Cholbei social profile logo</title>
  <desc id="desc">The Cholbei check-arrow C mark in acid green on a dark geometric background.</desc>
  <defs>
    <pattern id="grid" width="72" height="72" patternUnits="userSpaceOnUse">
      <path d="M72 0H0V72" fill="none" stroke="#fffdf7" stroke-opacity=".045" stroke-width="2"/>
    </pattern>
    <radialGradient id="glow" cx="50%" cy="46%" r="58%">
      <stop offset="0" stop-color="#7157ff" stop-opacity=".34"/>
      <stop offset=".68" stop-color="#7157ff" stop-opacity=".08"/>
      <stop offset="1" stop-color="#7157ff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1080" height="1080" rx="220" fill="#11110f"/>
  <rect width="1080" height="1080" rx="220" fill="url(#grid)"/>
  <circle cx="540" cy="505" r="445" fill="url(#glow)"/>
  <circle cx="540" cy="505" r="350" fill="none" stroke="#fffdf7" stroke-opacity=".09" stroke-width="3"/>
  <circle cx="540" cy="505" r="285" fill="none" stroke="#c9ff4a" stroke-opacity=".18" stroke-width="3"/>
  <g transform="translate(130 130) scale(12)" fill="none" stroke="#c9ff4a" stroke-width="5.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M43.5 16.5a21 21 0 1 0 3.2 31.8"/>
    <path d="m38 43.7 9.5 4.7 4.2-9.8"/>
  </g>
  <circle cx="825" cy="820" r="30" fill="#ff6433"/>
</svg>
