  <text x="905" y="745" fill="#fffdf7" font-family="Arial,Helvetica,sans-serif" font-size="55" font-weight="800" letter-spacing="-2">Own your website.</text>
  <text x="905" y="815" fill="#fffdf7" font-family="Georgia,Times New Roman,serif" font-size="58" font-style="italic">Own your infrastructure.</text>
