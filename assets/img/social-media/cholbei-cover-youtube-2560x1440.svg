      <stop stop-color="#7157ff"/>
      <stop offset="1" stop-color="#4d37d5"/>
    </linearGradient>
  </defs>
  <rect width="2560" height="1440" fill="#11110f"/>
  <rect width="2560" height="1440" fill="url(#grid)"/>
  <path d="M1910-140h790v1720h-980c360-360 420-1120 190-1720Z" fill="url(#violet)"/>
  <circle cx="2240" cy="215" r="510" fill="none" stroke="#c9ff4a" stroke-opacity=".25" stroke-width="4"/>
